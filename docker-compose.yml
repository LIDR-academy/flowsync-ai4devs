# Los dos servidores de desarrollo en contenedores, para quien no tenga `make`
# o quiera la misma máquina que CI. No sustituye a la instalación a mano del
# README: es la alternativa cuando esa falla por el sistema.
#
# Lo que hace cada servicio es lo mismo que `make setup` y `make start`: instala,
# crea el `.env` si no existe, migra y arranca. Las dependencias viven en un
# volumen propio para no pisar las del host, y la base de datos en `tmp/`,
# que está en el árbol y persiste entre arranques.
#
# Uso: docker compose up   (backend en http://localhost:3333, frontend en http://localhost:5173)
#
# Estado: `docker compose config` valida el fichero. `up` NO se ha ejecutado en
# la máquina donde se escribió (Docker instalado, daemon apagado). La primera
# persona que lo levante anota aquí la fecha y lo que hubo que tocar.

services:
  backend:
    image: node:24
    working_dir: /app
    command: >
      sh -c "npm ci
      && ([ -f .env ] || (cp .env.example .env && node ace generate:key))
      && node ace migration:run
      && node ace serve"
    environment:
      HOST: 0.0.0.0
      PORT: 3333
    ports:
      - '3333:3333'
    volumes:
      - ./backend:/app
      - backend_modules:/app/node_modules
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3333/api.json').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    image: node:24
    working_dir: /app
    command: sh -c "npm ci && npx vite --host 0.0.0.0 --port 5173"
    environment:
      # Lo lee el navegador de la persona, así que apunta al puerto publicado
      # en el host, no al nombre del servicio.
      VITE_API_URL: http://localhost:3333
    ports:
      - '5173:5173'
    volumes:
      - ./frontend:/app
      - frontend_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_modules:
  frontend_modules:
