# Un revisor de código sobre cada pull request. Publica los hallazgos en el
# propio PR —anclados a la línea— y no solo en el registro de ejecución: un
# hallazgo que hay que ir a buscar al log no lo lee nadie.
#
# Este trabajo NO funciona hasta que alguien dé de alta el secreto de la
# credencial y la app de GitHub. Los pasos manuales, los dos caminos de
# credencial y en qué se va el dinero están en `docs/ci-revisor.md`.
name: revisor

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# Lo mínimo que necesita: leerse el repositorio, escribir comentarios en el PR
# y pedir el token OIDC con el que la acción se autentica como la app de
# GitHub de Claude (sin `id-token: write` falla la autenticación).
permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    name: revisión de Claude
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Un pull request desde un fork no ve los secretos del repositorio, así que
    # la credencial llegaría vacía y el trabajo moriría en la primera llamada.
    # Este repositorio recibe PR de forks de alumnos: para esos, el trabajo se
    # salta limpiamente en vez de fallar en rojo. Ver `docs/ci-revisor.md`.
    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          # Camino de suscripción (`claude setup-token`). El camino de clave de
          # API usa OTRA entrada y OTRO secreto: `anthropic_api_key` con
          # `${{ secrets.ANTHROPIC_API_KEY }}`. No son intercambiables.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          prompt: |
            REPOSITORIO: ${{ github.repository }}
            PULL REQUEST: ${{ github.event.pull_request.number }}

            Eres un revisor adversarial: tu objetivo es refutar el cambio, no aprobarlo.

            Antes de mirar el diff, lee tu calibración, en este orden:
            - `REVIEW.md` — qué es grave aquí, cuántas sugerencias caben, dónde no se
              reporta y por qué hay que citar `fichero:línea`. Manda sobre este prompt.
            - `CLAUDE.md` — cómo se escribe el código aquí y las reglas de proceso.
            - `openspec/specs/` — la spec viva. Un cambio que contradiga un scenario es grave.

            Publica los hallazgos donde se leen, no en el registro de ejecución:
            - cada hallazgo anclado a su línea con `mcp__github_inline_comment__create_inline_comment`;
            - un resumen corto al final con `gh pr comment`.
            Si no los publicas, para quien abrió el PR no existen.

            No redirijas la salida de ningún comando a un fichero (`>`, `>>`, `tee`): no
            tienes herramienta de escritura, el intento se deniega y te cuesta un turno.
            Lee la salida directa del comando.

          # `Read`, `Grep` y `Glob` no son opcionales: sin ellas no puede abrir ni la
          # calibración ni un solo fichero del cambio, y cada intento denegado le cuesta
          # un turno de los 40. El resto son las herramientas con las que publica.
          claude_args: |
            --model sonnet
            --effort medium
            --max-turns 40
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
