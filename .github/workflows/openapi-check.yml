name: OpenAPI contract check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  openapi-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26.8.1'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - run: npm run openapi:check
