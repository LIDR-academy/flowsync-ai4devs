name: Verificación

# La documentación viva solo se sostiene si algo la comprueba en cada cambio.
# Sin esto, `docs/` vuelve a ser una foto del día que se escribió.

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: cp .env.example .env && node ace generate:key
      - run: npm run typecheck
      - run: npm run lint
      # La suite escribe sobre su propio fichero de base de datos (ADR-0001),
      # así que no hace falta preparar nada más.
      - run: npm test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      # El typecheck del frontend vive dentro del build.
      - run: npm run build
      # Vitest sobre `lib/api.ts`, que es el unico punto de contacto con el
      # backend y donde vive la logica del frontend. El runner venia de
      # `s3/start` y no cruzo de rama; se recupero el 2026-09-02.
      - run: npm test

  documentacion:
    name: La documentación corresponde con el código
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # El verificador pregunta las rutas a `node ace list:routes --json` en vez
      # de parsear el fuente, así que necesita el backend instalado.
      - name: Instalar el backend
        run: npm ci
        working-directory: backend

      - name: Preparar entorno del backend
        run: cp .env.example .env && node ace generate:key
        working-directory: backend

      - name: Contrastar documentación contra código
        run: node scripts/verificar-docs.mjs

      - name: Validar las specs vivas
        run: |
          # Version fijada a proposito, para que no se mueva sola bajo los
          # pies de la build.
          npm install -g @fission-ai/openspec@1.10.0
          openspec validate --specs
        env:
          OPENSPEC_TELEMETRY: '0'
