name: Claude adversarial review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Solo lo que hace falta para leer el repo y dejar que la app de GitHub de
# Claude publique comentarios con su propio token de instalación (no el
# GITHUB_TOKEN de este job). Ver docs/ci-revisor.md.
permissions:
  contents: read
  pull-requests: read
  issues: read
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Lee `.claude/agents/adversarial-reviewer.md` y actúa exactamente como
            ese agente: tu único objetivo es refutar este cambio, no aprobarlo.

            Contrasta el diff de este pull request contra los scenarios de
            `openspec/specs/`. Busca (1) desviaciones de la spec, (2) edge cases
            no manejados, (3) fugas de seguridad o de datos, (4) supuestos
            frágiles. No edites ningún archivo.

            No redirijas la salida de ninguna herramienta a un fichero: lee la
            salida directa.

            Publica cada hallazgo como un comentario en este pull request,
            priorizado (crítico/alto/medio), con evidencia (archivo:línea) y el
            scenario que rompe. Si no encuentras nada tras buscar a fondo, dilo
            en un único comentario resumen.
          claude_args: |
            --model sonnet
            --effort medium
            --max-turns 40
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment"
