spring.application.name=FlowSync

server.port=8080

# Fuerza JSON en TODOS los errores (equivalente a force_json_response_middleware.ts):
# sin esto, una ruta no registrada devuelve la pagina Whitelabel HTML de Spring
# en vez de pasar por GlobalExceptionHandler.
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
server.error.whitelabel.enabled=false

# --- H2 embebido (dev) ---
# Modo file: persiste entre reinicios en ./data/flowsync-dev.mv.db (equivalente al db.sqlite3 de Adonis)
spring.datasource.url=jdbc:h2:file:./data/flowsync-dev;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola web de H2 (http://localhost:8080/h2-console) - solo dev
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Flyway: fuente de verdad del esquema (equivalente a "node ace migration:run").
# Hibernate solo valida que las entidades coincidan, no genera DDL.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Request id por peticion (equivalente a generateRequestId:true en config/app.ts)
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%X{requestId}] %logger{36} - %msg%n

# JWT (equivalente al token de acceso de AccessTokensController)
flowsync.jwt.secret=${JWT_SECRET:change-this-dev-secret-please-32-bytes-min}
flowsync.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}

# CORS (equivalente a config/cors.ts: abierto en dev)
flowsync.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
