spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
server.error.whitelabel.enabled=false

# H2 en memoria para tests (equivalente a .env.test de Adonis)
spring.datasource.url=jdbc:h2:mem:flowsync-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

flowsync.jwt.secret=test-secret-key-only-for-tests-32-bytes-min
flowsync.jwt.expiration-minutes=60

flowsync.cors.allowed-origins=http://localhost:5173
